services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: openclaw-lab-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LAB_PROJECT_ROOT: /app
      LAB_TEMPLATE_DIR: /app/openclaw-training-fork
      LAB_DIR: /app/.lab
      LAB_WORKSPACES_DIR: /app/.lab/workspaces
      LAB_RUNNER_JOBS_DIR: /app/.lab/runner-jobs
      LAB_RUNNER_MODE: file
      LAB_CONTAINER_WORKSPACES_DIR: /workspaces
      LAB_NODE_MODULES_TARGET: /deps/project/node_modules
      LAB_RUN_TIMEOUT_SECONDS: 120
      LAB_WORKSPACE_OWNER_UID: 10001
      LAB_WORKSPACE_OWNER_GID: 10001
    volumes:
      - ./openclaw-training-fork:/app/openclaw-training-fork:ro
      - openclaw_lab_workspaces:/app/.lab/workspaces
      - openclaw_lab_runner_jobs:/app/.lab/runner-jobs
    depends_on:
      - runner
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: openclaw-lab-frontend
    environment:
      LAB_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  ide:
    build:
      context: .
      dockerfile: docker/ide.Dockerfile
      extra_hosts:
        - "registry.npmjs.org:104.16.0.35"
        - "github.com:140.82.112.3"
        - "release-assets.githubusercontent.com:185.199.111.133"
        - "objects.githubusercontent.com:185.199.108.133"
    container_name: openclaw-lab-ide
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - openclaw_lab_workspaces:/workspaces
      - openclaw_lab_ide_data:/ide-data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    networks:
      - ide_internal

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    container_name: openclaw-lab-runner
    network_mode: "none"
    environment:
      RUNNER_JOBS_DIR: /runner-jobs
      RUNNER_WORKSPACES_ROOT: /workspaces
      RUNNER_TEST_USER: labuser
    volumes:
      - openclaw_lab_workspaces:/workspaces:ro
      - openclaw_lab_runner_jobs:/runner-jobs
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true

volumes:
  openclaw_lab_workspaces:
  openclaw_lab_runner_jobs:
  openclaw_lab_ide_data:

networks:
  ide_internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
